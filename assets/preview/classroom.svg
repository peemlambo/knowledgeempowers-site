<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Public Sans, Arial, sans-serif">
  <rect width="800" height="600" fill="#F4EDE6"/>
  <circle cx="110" cy="110" r="120" fill="none" stroke="#B08D57" stroke-opacity=".35"/>
  <!-- classroom screen -->
  <rect x="96" y="62" width="608" height="10" fill="#C9BDB6"/>
  <g transform="translate(110 76)">
    <rect x="8" y="14" width="580" height="330" fill="#3C140A" opacity=".10"/>
    <rect width="580" height="330" fill="#fff" stroke="#E6DCD6"/>
    <text x="34" y="44" font-size="13" fill="#5F5352">Fractions · Question 1 of 15 · <tspan fill="#7A0000" font-weight="700">Easy</tspan></text>
    <text x="536" y="50" font-size="30" font-family="Bitter, Georgia, serif" font-weight="600" fill="#1E1414" text-anchor="end">1:00</text>
    <text x="34" y="132" font-size="38" fill="#1E1414">Simplify</text>
    <text x="214" y="112" font-size="30" fill="#1E1414" text-anchor="middle">12</text>
    <line x1="194" y1="122" x2="234" y2="122" stroke="#1E1414" stroke-width="2.5"/>
    <text x="214" y="154" font-size="30" fill="#1E1414" text-anchor="middle">18</text>
    <text x="250" y="132" font-size="38" fill="#1E1414">fully.</text>
    <line x1="34" y1="186" x2="546" y2="186" stroke="#E6DCD6"/>
    <text x="34" y="220" font-size="17" font-weight="700" fill="#7A0000">1. Rule: divide the top and the bottom by the HCF.</text>
    <text x="34" y="252" font-size="17" fill="#1E1414">2. The HCF of 12 and 18 is 6.</text>
    <text x="34" y="292" font-size="17" fill="#1E1414">3.</text>
    <text x="78" y="282" font-size="15" fill="#1E1414" text-anchor="middle">12 ÷ 6</text><line x1="54" y1="288" x2="102" y2="288" stroke="#1E1414" stroke-width="1.5"/><text x="78" y="306" font-size="15" fill="#1E1414" text-anchor="middle">18 ÷ 6</text>
    <text x="114" y="296" font-size="17" fill="#1E1414">=</text>
    <text x="140" y="282" font-size="15" fill="#1E1414" text-anchor="middle">2</text><line x1="132" y1="288" x2="148" y2="288" stroke="#1E1414" stroke-width="1.5"/><text x="140" y="306" font-size="15" fill="#1E1414" text-anchor="middle">3</text>
  </g>
  <!-- desks and learners -->
  <g fill="#7A0000" opacity=".9">
    <circle cx="220" cy="470" r="18"/><rect x="196" y="492" width="48" height="40" rx="16"/>
    <circle cx="340" cy="478" r="18"/><rect x="316" y="500" width="48" height="40" rx="16"/>
    <circle cx="460" cy="478" r="18"/><rect x="436" y="500" width="48" height="40" rx="16"/>
    <circle cx="580" cy="470" r="18"/><rect x="556" y="492" width="48" height="40" rx="16"/>
  </g>
  <rect x="160" y="528" width="480" height="10" fill="#B08D57" opacity=".6"/>
  <text x="400" y="578" font-size="14" fill="#5F5352" text-anchor="middle">Show it on the classroom screen, or practise at home</text>
</svg>
