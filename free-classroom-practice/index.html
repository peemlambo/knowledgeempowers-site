function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
/* ---------- notation: \f{a}{b}, ^{..}, _{..}, \r{..} ---------- */
function grab(s,i){ // s[i]=='{' -> [content,endIndex]
  var d=0;for(var j=i;j<s.length;j++){if(s[j]==='{')d++;else if(s[j]==='}'){d--;if(d===0)return [s.slice(i+1,j),j+1]}}return [s.slice(i+1),s.length]}
function M(src){
  var s=String(src),out='',i=0;
  while(i<s.length){
    if(s.startsWith('\\f{',i)){var a=grab(s,i+2),b=grab(s,a[1]);out+='<span class="fr"><span class="nu">'+M(a[0])+'</span><span class="de">'+M(b[0])+'</span></span>';i=b[1];continue}
    if(s.startsWith('\\r{',i)){var r=grab(s,i+2);out+='<span class="rt">√<span class="rad">'+M(r[0])+'</span></span>';i=r[1];continue}
    if(s.startsWith('^{',i)){var p=grab(s,i+1);out+='<sup>'+M(p[0])+'</sup>';i=p[1];continue}
    if(s.startsWith('_{',i)){var q=grab(s,i+1);out+='<sub>'+M(q[0])+'</sub>';i=q[1];continue}
    out+=esc(s[i]);i++;
  }
  return out;
}

/* ---------- a timer based on clock time, so it stays right when the tab is hidden ---------- */
function Timer(sec,onTick){this.dur=sec;this.left=sec*1000;this.end=0;this.run=false;this.onTick=onTick;var me=this;this.h=setInterval(function(){me.tick()},200)}
Timer.prototype.tick=function(){if(this.run){this.left=Math.max(0,this.end-Date.now());if(this.left===0)this.run=false}this.onTick&&this.onTick(this)};
Timer.prototype.start=function(){if(this.left<=0)return;this.end=Date.now()+this.left;this.run=true;this.tick()};
Timer.prototype.pause=function(){if(this.run){this.left=Math.max(0,this.end-Date.now());this.run=false}this.tick()};
Timer.prototype.toggle=function(){this.run?this.pause():this.start()};
Timer.prototype.reset=function(sec){if(sec!=null)this.dur=sec;this.run=false;this.left=this.dur*1000;this.tick()};
Timer.prototype.add=function(s){var nd=Math.max(15,this.dur+s);var diff=(nd-this.dur)*1000;this.dur=nd;this.left=Math.max(0,this.left+diff);if(this.run)this.end+=diff;this.tick()};
Timer.prototype.kill=function(){clearInterval(this.h)};
function fmt(ms){var s=Math.ceil(ms/1000),m=Math.floor(s/60);return m+':'+String(s%60).padStart(2,'0')}

/* answer check: numbers and fractions by value, everything else by its written form */
function num(s){s=s.replace(/\s+/g,' ').trim();var m=s.match(/^(-?\d+(?:\.\d+)?)$/);if(m)return +m[1];m=s.match(/^(-?)(\d+) \(?(\d+)\)?\/\(?(\d+)\)?$/);if(m)return (m[1]?-1:1)*(+m[2]+m[3]/m[4]);m=s.match(/^(-?)\(?(-?\d+(?:\.\d+)?)\)?\/\(?(\d+(?:\.\d+)?)\)?$/);if(m)return (m[1]?-1:1)*(m[2]/m[3]);return null}
function norm(s){return plain(s).toLowerCase().replace(/[−–]/g,'-').replace(/(\d),(\d)/g,'$1.$2').replace(/(\d)\s(?=\d{3}\b)/g,'$1').replace(/≈|°|cups?|pages?|\bm\b|c$/g,'').replace(/\s*([=;,+\-×*/()])\s*/g,'$1').replace(/\s+/g,' ').trim()}
function checkable(a){return !/proved|no:|by |bigger|,.*,/i.test(plain(a))&&plain(a).length<=32}
function gcd(a,b){return b?gcd(b,a%b):a}
function fac(s){var m=s.match(/^(-?\d*)((?:\([^()]+\))+)$/);if(!m)return null;return m[1]+'|'+m[2].match(/\([^()]+\)/g).sort().join('')}
function same(mine,a){var x=norm(mine),y=norm(a);if(!x)return false;if(x===y)return true;var nx=num(x.replace(/[()]/g,'').replace(/^[a-z]=/,'')),ny=num(y.replace(/[()]/g,'').replace(/^[a-z]=/,''));if(nx!=null&&ny!=null){if(Math.abs(nx-ny)>1e-9)return false;var fm=x.match(/(\d+)\/(\d+)$/);if(fm&&gcd(+fm[1],+fm[2])>1)return 'simplify';return true}if(!/[a-z]/.test(y)&&x.replace(/[()]/g,'')===y.replace(/[()]/g,''))return true;
  var fx=fac(x),fy=fac(y);if(fx&&fy&&fx===fy)return true;
  var sx=x.split(/;|and|or/).map(function(s){return s.trim().replace(/^[a-z]=/,'')}).sort().join('|'),sy=y.split(/;|and|or/).map(function(s){return s.trim().replace(/^[a-z]=/,'')}).sort().join('|');return sx===sy}

  function paintClock(tm){var c=$('#sClock');if(!c)return;c.textContent=fmt(tm.left);c.classList.toggle('zero',tm.left<=0);c.classList.toggle('paused',!tm.run&&tm.left>0&&tm.left<tm.dur*1000);var b=$('#dTimer');if(b)b.textContent=tm.left<=0?'Time is up':tm.run?'Pause timer':(tm.left<tm.dur*1000?'Resume timer':'Start timer');broadcast()}

    broadcast();
  }
  function move(d){var n=i+d;if(n<0||n>=list.length)return;save();i=n;load();paint()}
  function setSet(v){save();set=v;list=items(t,set);i=0;load();$('#dSet').value=v;paint()}
  function full(){var el=document.documentElement;try{if(!document.fullscreenElement){(el.requestFullscreen||el.webkitRequestFullscreen).call(el)}else{document.exitFullscreen()}}catch(e){}}
  function hide(v){showDock=!v;$('#dock').hidden=v;$('#dShow').hidden=!v}
  var A={prev:function(){move(-1)},next:function(){move(1)},timer:function(){timer.toggle()},reset:function(){timer.reset()},plus:function(){timer.add(30)},minus:function(){timer.add(-30)},

/* ---------- teacher controls window: sees the answer before the class does ---------- */
function controls(t){

    $('#cPos').textContent=m.kind+' '+(m.i+1)+' of '+m.n+(m.lvl?' · '+LV[m.lvl]:'');$('#cQ').innerHTML=M(m.q);$('#cA').innerHTML=M(m.a);$('#cS').innerHTML=m.s.map(function(x){return '<li>'+M(x)+'</li>'}).join('');

/* ---------- practice ---------- */
function practice(t,startAt){
  var key='pr-'+t.slug,P=store(key)||{marks:{},lvl:'all'},lvl=P.lvl||'all',view=[],i=0,shown={};
  function filter(){view=t.qs.map(function(q,n){return n}).filter(function(n){return lvl==='all'||t.qs[n][0]===lvl});i=Math.min(i,view.length-1)}
  filter();if(startAt!=null){lvl='all';filter();i=Math.max(0,view.indexOf(startAt))}
  var tries={};
  var timer=new Timer(t.qs[view[0]][4],function(tm){var c=$('#pClock');if(!c)return;c.textContent=fmt(tm.left);c.classList.toggle('zero',tm.left<=0);c.classList.toggle('paused',!tm.run&&tm.left>0&&tm.left<tm.dur*1000);
    var b=$('#pStart');if(b)b.textContent=tm.left<=0?'':tm.run?'Pause':(tm.left<tm.dur*1000?'Resume':'Start timer');var z=$('#pZero');if(z)z.hidden=tm.left>0});
  cleanup.push(function(){timer.kill()});
  app.innerHTML=header()+'<main class="wrap pr"><div class="crumbs"><a href="#topics">Topics</a> › <a href="#topic-'+t.slug+'">'+esc(t.title)+'</a> › Practice</div>'+
  '<div class="pr-top"><h1>'+esc(t.title)+'</h1></div>'+
  '<div><div class="bar"><i id="pBar"></i></div><div class="score" id="pScore" style="margin-top:6px"></div></div><div id="pDots" hidden></div><div id="pCard"></div>'+buyBox(t)+'</main>'+footer();
  function save(){P.lvl=lvl;store(key,P)}
  function score(){var g=0,p=0,n=0,done=0;view.forEach(function(k){var m=P.marks[k];if(m){done++;if(m==='g')g++;else if(m==='p')p++;else n++}});
    $('#pBar').style.width=(view.length?done/view.length*100:0)+'%';
    $('#pScore').textContent=done?g+' right so far':'';
    $('#pDots').innerHTML=view.map(function(k,n){var m=P.marks[k]||'';return '<button class="dot '+m+(n===i?' cur':'')+'" data-n="'+n+'" aria-label="Question '+(k+1)+'">'+(k+1)+'</button>'}).join('');
    app.querySelectorAll('.dot').forEach(function(d){d.onclick=function(){i=+d.dataset.n;open()}});
    return done}
  function open(){
    var k=view[i],q=t.qs[k],s=shown[k]||(shown[k]={a:false,s:false}),m=P.marks[k]||'';
    timer.reset(q[4]);
    $('#pCard').innerHTML='<article class="pq"><div class="pad" id="pPad" role="button" tabindex="0"><span>Working out</span><small>Tap here, then write with the pen</small></div><div class="pq-head"><span class="tiny">Question '+(k+1)+' of '+t.qs.length+'</span><span class="lvchip">'+LV[q[0]]+'</span></div>'+
     '<div class="q">'+M(q[1])+'</div>'+
     '<div class="timer"><div class="clock" id="pClock" style="font-size:1.4rem"></div><button class="textlink" id="pStart">Start timer</button><span class="tiny" id="pZero" hidden>Time is up.</span></div>'+
     (checkable(q[2])?'<div class="chk"><input class="ans" id="pMine" autocomplete="off" placeholder="Your answer, e.g. 3/4 or −5"><div class="self"><button class="btn pri" id="pCheck">Check</button><button class="textlink" id="pS">'+(s.s?'Hide solution':'Show solution')+'</button></div><div id="pFb"></div></div>':
     '<div class="chk"><input class="ans" id="pMine" autocomplete="off" placeholder="Write your answer, then compare"><div class="self"><button class="btn pri" id="pS">'+(s.s?'Hide solution':'Show solution')+'</button></div></div>')+

     (s.a?'<div class="reveal ans"><span class="tiny">Answer</span><div><b>'+M(q[2])+'</b></div></div>':'')+
     (s.s?'<div class="reveal sol"><span class="tiny">Worked solution</span><ol class="stepsl">'+q[3].map(function(x){return '<li>'+M(x)+'</li>'}).join('')+'</ol></div>':'')+
     (checkable(q[2])?'':'<div class="self"><span class="tiny">Did you get it?</span><button class="textlink" data-m="g">Yes</button><button class="textlink" data-m="n">Not yet</button></div>')+
     '<div class="pq-nav"><button class="textlink" id="pPrev"'+(i===0?' hidden':'')+'>← Back</button><button class="btn" id="pNext">'+(i===view.length-1?'Finish':'Next →')+'</button></div></article>';
    var mine=$('#pMine');mine.value=(P.notes&&P.notes[k])||'';mine.oninput=function(){P.notes=P.notes||{};P.notes[k]=mine.value;save()};
    var ck=$('#pCheck');if(ck){var fb=$('#pFb'),tr=tries[k]||0;
      if(tr===1&&!s.a)fb.innerHTML='<div class="fb hint"><b>Not quite. Here is a hint:</b> '+M(q[3][0])+'</div>';
      ck.onclick=function(){if(!mine.value.trim()){fb.innerHTML='<div class="fb hint">Type your answer first.</div>';return}
        var res=same(mine.value,q[2]);if(res==='simplify'){fb.innerHTML='<div class="fb hint"><b>Right value.</b> Now simplify your fraction fully.</div>';return}
        if(res){P.marks[k]='g';save();score();fb.innerHTML='<div class="fb ok"><b>Correct!</b></div>';return}
        tries[k]=(tries[k]||0)+1;
        if(tries[k]===1){fb.innerHTML='<div class="fb hint"><b>Not quite. Here is a hint:</b> '+M(q[3][0])+'</div>'}
        else{P.marks[k]=P.marks[k]||'n';save();s.a=true;s.s=true;keep(open);var f2=$('#pFb');if(f2)f2.innerHTML='<div class="fb no"><b>Not yet.</b> Follow the steps below, then try the next one.</div>'}}}
    $('#pStart').onclick=function(){timer.toggle()};
    $('#pS').onclick=function(){s.s=!s.s;s.a=s.s;keep(open)};
    app.querySelectorAll('[data-m]').forEach(function(b){b.onclick=function(){P.marks[k]=b.dataset.m;save();app.querySelectorAll('[data-m]').forEach(function(x){x.setAttribute('aria-pressed',x===b)});score()}});
    $('#pPrev').onclick=function(){i--;open()};$('#pNext').onclick=function(){if(i<view.length-1){i++;open()}else finish()};
    var pd=$('#pPad');if(pd)pd.onclick=pd.onkeydown=function(e){if(e.type==='keydown'&&e.key!=='Enter'&&e.key!==' ')return;if(window.__ink)window.__ink.open()};
    score();timer.tick();
  }
  function keep(fn){var left=timer.left,run=timer.run,dur=timer.dur;fn();timer.dur=dur;timer.left=left;if(run)timer.start();else timer.tick()}
  function finish(){timer.pause();var done=score();var g=0,p=0;view.forEach(function(k){if(P.marks[k]==='g')g++;if(P.marks[k]==='p')p++});
    $('#pCard').innerHTML='<div class="done"><h2>Done</h2><p>'+g+' of '+view.length+' right. Try the ones you missed again.</p>'+
    '<div class="self"><button class="btn" id="pAgain">Start again</button>'+waBtn('I just practised '+t.title+'. Try it free:',t.slug,'practice','Share')+'</div></div>';
    $('#pAgain').onclick=function(){view.forEach(function(k){delete P.marks[k]});shown={};save();i=0;open()}}
  app.querySelectorAll('.chip[data-l]').forEach(function(c){c.onclick=function(){lvl=c.dataset.l;save();app.querySelectorAll('.chip[data-l]').forEach(function(x){x.setAttribute('aria-pressed',x===c)});i=0;filter();open()}});
  open();
}
if(!location.hash&&START)location.hash=START;
route();
})();
</script>

<style>

<script>
/* Write on any screen. Lines are kept in page position, so they stay on the working when the page scrolls.
   They are wiped when the topic, slide or question changes. Nothing is saved. */
(function(){
  'use strict';
  var cv=document.createElement('canvas');cv.id='inkCv';cv.setAttribute('aria-hidden','true');
  var btn=document.createElement('button');btn.className='inkbtn';btn.type='button';btn.textContent='✎';btn.title='Write on the screen';btn.setAttribute('aria-label','Write on the screen');
  var bar=document.createElement('div');bar.className='inkbar';bar.hidden=true;bar.setAttribute('role','toolbar');bar.setAttribute('aria-label','Writing tools');
  bar.innerHTML='<button type="button" data-t="pen" aria-pressed="true"><span class="sw" style="background:var(--maroon)"></span>Pen</button>'+
    '<button type="button" data-t="hi" aria-pressed="false"><span class="sw" style="background:#F5D33A"></span>Highlight</button>'+
    '<button type="button" data-t="er" aria-pressed="false">Eraser</button><i></i>'+
    '<button type="button" data-a="undo">Undo</button><button type="button" data-a="clear">Clear</button>'+
    '<button type="button" class="done" data-a="done">Done</button>';
  document.body.appendChild(cv);document.body.appendChild(btn);document.body.appendChild(bar);
  var ctx=cv.getContext('2d'),strokes=[],cur=null,tool='pen',dpr=1;
  function size(){dpr=window.devicePixelRatio||1;cv.width=Math.round(innerWidth*dpr);cv.height=Math.round(innerHeight*dpr);draw()}
  function penColour(){return getComputedStyle(document.documentElement).getPropertyValue('--maroon').trim()||'#7A0000'}
  function draw(){
    ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,innerWidth,innerHeight);
    var sx=scrollX,sy=scrollY;
    strokes.forEach(function(s){
      if(!s.p.length)return;
      ctx.save();ctx.lineCap='round';ctx.lineJoin='round';
      if(s.t==='hi'){ctx.globalAlpha=.35;ctx.strokeStyle='#F5D33A';ctx.fillStyle='#F5D33A';ctx.lineWidth=18}
      else{ctx.strokeStyle=penColour();ctx.fillStyle=ctx.strokeStyle;ctx.lineWidth=3}
      ctx.beginPath();
      if(s.p.length===1){ctx.arc(s.p[0][0]-sx,s.p[0][1]-sy,ctx.lineWidth/2,0,7);ctx.fill()}
      else{ctx.moveTo(s.p[0][0]-sx,s.p[0][1]-sy);for(var k=1;k<s.p.length;k++)ctx.lineTo(s.p[k][0]-sx,s.p[k][1]-sy);ctx.stroke()}
      ctx.restore();
    });
  }
  function pt(e){return [e.clientX+scrollX,e.clientY+scrollY]}
  function rub(p){var r=14,before=strokes.length;
    strokes=strokes.filter(function(s){var w=s.t==='hi'?9:2;return !s.p.some(function(q){var dx=q[0]-p[0],dy=q[1]-p[1];return dx*dx+dy*dy<(r+w)*(r+w)})});
    if(strokes.length!==before)draw()}
  cv.addEventListener('pointerdown',function(e){if(!document.body.classList.contains('inking'))return;e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(x){}
    if(tool==='er'){cur={er:true};rub(pt(e));return}
    cur={t:tool,p:[pt(e)]};strokes.push(cur);draw()});
  cv.addEventListener('pointermove',function(e){if(!cur)return;e.preventDefault();
    if(cur.er){rub(pt(e));return}
    var evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];if(!evs.length)evs=[e];
    evs.forEach(function(v){cur.p.push(pt(v))});draw()});
  function end(){cur=null}
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);cv.addEventListener('lostpointercapture',end);
  function open(v){document.body.classList.toggle('inking',v);bar.hidden=!v;btn.hidden=v;if(v)setTool(tool==='er'?'pen':tool)}
  function setTool(t){tool=t;document.body.classList.toggle('ink-erase',t==='er');bar.querySelectorAll('[data-t]').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.t===t)})}
  function clear(){strokes=[];cur=null;draw()}
  btn.onclick=function(){open(true)};
  bar.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
    if(b.dataset.t)setTool(b.dataset.t);
    else if(b.dataset.a==='undo'){strokes.pop();draw()}
    else if(b.dataset.a==='clear')clear();
    else if(b.dataset.a==='done')open(false)});
  /* new topic, slide or question: start with a clean screen */
  var sig='';function key(){var q=document.querySelector('.stage-q,.pq .q,.done h2');return location.hash+'|'+(q?q.textContent:'')}
  function check(){var k=key();if(k!==sig){sig=k;clear()}}
  addEventListener('hashchange',function(){setTimeout(check,0)});setInterval(check,300);
  addEventListener('scroll',draw,{passive:true});addEventListener('resize',size);
  document.addEventListener('fullscreenchange',function(){setTimeout(size,100)});
  window.__ink={strokes:function(){return strokes.length},clear:clear,open:function(){open(true)}};
  sig=key();size();
})();
</script>

<style>
/* ---------- full screen button ---------- */
.fsbtn{position:fixed;right:max(10px,env(safe-area-inset-right,0px));top:42%;z-index:70;width:46px;height:46px;border-radius:50%;border:1px solid #E6DEDE;background:#fff;color:#7A0000;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.12);display:grid;place-items:center;padding:0}
.fsbtn:hover,.fsbtn:focus-visible{border-color:#7A0000;outline:none}
.fsbtn svg{width:22px;height:22px}
@media print{.fsbtn{display:none!important}}
</style>
<script>
/* Full screen: fills the whole screen (the website menu and browser bars go away). Press again or Esc to leave. */
(function(){
  var d=document,el=d.documentElement;
  var can=!!(el.requestFullscreen||el.webkitRequestFullscreen)&&(d.fullscreenEnabled!==false||d.webkitFullscreenEnabled);
  if(!can)return;                                   // e.g. iPhone: not allowed for web pages, so no button
  var OPEN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
  var SHUT='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>';
  var b=d.createElement('button');b.type='button';b.className='fsbtn';
  function isFull(){return !!(d.fullscreenElement||d.webkitFullscreenElement)}
  function paint(){var f=isFull();b.innerHTML=f?SHUT:OPEN;b.title=f?'Leave full screen':'Full screen';b.setAttribute('aria-label',b.title)}
  b.onclick=function(){try{if(isFull())(d.exitFullscreen||d.webkitExitFullscreen).call(d);else(el.requestFullscreen||el.webkitRequestFullscreen).call(el)}catch(e){}};
  d.addEventListener('fullscreenchange',paint);d.addEventListener('webkitfullscreenchange',paint);
  paint();
  function place(){if(d.body&&!b.isConnected)d.body.appendChild(b)}   // put it back if a page change removes it
  if(window.__fsTimer)clearInterval(window.__fsTimer);           // only one button, even after the page is replaced
  Array.prototype.forEach.call(d.querySelectorAll('.fsbtn'),function(x){x.remove()});
  place();window.__fsTimer=setInterval(place,1000);
})();
</script>
</body></html>
