<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fbf8f7;font-family:'Public Sans',system-ui,sans-serif;color:#1f1b1a;font-size:19px}
.box{width:min(92vw,440px);background:#fff;border:1px solid #e7dedc;border-radius:16px;box-shadow:0 6px 24px rgba(60,20,20,.08);padding:30px 26px;text-align:center}
h1{font-family:'Bitter',Georgia,serif;color:#7A0000;font-size:1.5rem;margin:0 0 .3em}
p{color:#6b6260;margin:.3em 0 1em;font-size:.95rem}
input{font:inherit;width:100%;box-sizing:border-box;text-align:center;letter-spacing:.12em;text-transform:uppercase;padding:12px;border:1.5px solid #cbbfbc;border-radius:12px}
input:focus{outline:none;border-color:#7A0000;box-shadow:0 0 0 3px rgba(122,0,0,.12)}
button{font:inherit;font-weight:700;width:100%;margin-top:12px;padding:12px;border:0;border-radius:12px;background:#7A0000;color:#fff;cursor:pointer}
button:disabled{opacity:.6}
.msg{min-height:1.4em;margin-top:12px;color:#a11d1d;font-size:.9rem}
.small{font-size:.78rem;color:#8a817f;margin-top:18px}
.or{display:flex;align-items:center;gap:10px;color:#8a817f;font-size:.85rem;margin:20px 0 4px}
.or:before,.or:after{content:"";flex:1;height:1px;background:#e7dedc}
.wa{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px;padding:12px;border:1.5px solid #7A0000;border-radius:12px;color:#7A0000;font-weight:700;text-decoration:none}
.wa:hover{background:#fbf1f0}
.wa svg{width:24px;height:24px;flex:none}
.wa-num{display:block;font-size:.85rem;color:#6b6260;margin-top:6px}
</style>

<script>
function deviceId() {
  try {
    var id = localStorage.getItem('ke-device-id');
    if (!id) { id = 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10); localStorage.setItem('ke-device-id', id); }
    return id;
  } catch (e) { return ''; }
}
function openPack_(code) {
  var btn = document.getElementById('go'), msg = document.getElementById('msg');
  btn.disabled = true; msg.style.color = '#6b6260'; msg.textContent = 'Opening your pack\u2026';
  google.script.run
    .withSuccessHandler(function (res) {
      if (res && res.ok) {
        try { localStorage.setItem('ke-code', code); } catch (e) {}
        var h = String(res.html), fm = document.getElementById('fsmod'), k = h.toLowerCase().lastIndexOf('</body>');
        if (fm && k > -1) h = h.slice(0, k) + fm.innerHTML + h.slice(k);   // full screen button on the pack page too
        document.open(); document.write(h); document.close();
      } else { btn.disabled = false; msg.style.color = '#a11d1d'; msg.textContent = (res && res.msg) || 'Something went wrong. Please try again.'; }
    })
    .withFailureHandler(function (err) { btn.disabled = false; msg.style.color = '#a11d1d'; msg.textContent = 'We could not open the pack. ' + ((err && err.message) ? '(' + err.message + ') ' : '') + 'Check your internet and try again, or contact us on WhatsApp.'; })
    .openPack(code, deviceId());
}
document.getElementById('go').onclick = function () { var c = document.getElementById('code').value.trim(); if (c) openPack_(c); };
document.getElementById('code').addEventListener('keydown', function (e) { if (e.key === 'Enter') document.getElementById('go').click(); });
try { var saved = localStorage.getItem('ke-code'); if (saved) { document.getElementById('code').value = saved; openPack_(saved); } } catch (e) {}
</script>

/* Full screen: fills the whole screen (the website menu and browser bars go away). Press again or Esc to leave. */
(function(){
  var d=document,el=d.documentElement;
  var can=!!(el.requestFullscreen||el.webkitRequestFullscreen)&&(d.fullscreenEnabled!==false||d.webkitFullscreenEnabled);
  if(!can)return;                                   // e.g. iPhone: not allowed for web pages, so no button
  var OPEN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
  var SHUT='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>';
  var b=d.createElement('button');b.type='button';b.className='fsbtn';
  function isFull(){return !!(d.fullscreenElement||d.webkitFullscreenElement)}
  function paint(){var f=isFull();b.innerHTML=f?SHUT:OPEN;b.title=f?'Leave full screen':'Full screen';b.setAttribute('aria-label',b.title)}
  b.onclick=function(){try{if(isFull())(d.exitFullscreen||d.webkitExitFullscreen).call(d);else(el.requestFullscreen||el.webkitRequestFullscreen).call(el)}catch(e){}};
  d.addEventListener('fullscreenchange',paint);d.addEventListener('webkitfullscreenchange',paint);
  paint();
  function place(){if(d.body&&!b.isConnected)d.body.appendChild(b)}   // put it back if a page change removes it
  if(window.__fsTimer)clearInterval(window.__fsTimer);           // only one button, even after the page is replaced
  Array.prototype.forEach.call(d.querySelectorAll('.fsbtn'),function(x){x.remove()});
  place();window.__fsTimer=setInterval(place,1000);
})();
</script>

<style>
/* ---------- writing on the screen: pen, highlighter, eraser ---------- */
#inkCv{position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:60;pointer-events:none}
body.inking #inkCv{pointer-events:auto;touch-action:none;cursor:crosshair}

.inkbtn{position:fixed;right:max(10px,env(safe-area-inset-right,0px));top:58%;z-index:61;width:48px;height:48px;border-radius:50%;border:1px solid #E6DEDE;background:#fff;color:#7A0000;font-size:1.35rem;line-height:1;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.12);display:grid;place-items:center;padding:0}
.inkbtn:hover,.inkbtn:focus-visible{border-color:#7A0000}
.inkbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:61;display:flex;align-items:center;gap:4px;background:#fff;border:1px solid #E6DEDE;border-radius:999px;padding:5px;box-shadow:0 4px 18px rgba(0,0,0,.14);max-width:calc(100vw - 16px)}
.inkbar button{display:inline-flex;align-items:center;border:1px solid transparent;background:none;border-radius:999px;min-height:42px;padding:.3rem .8rem;font-size:.88rem;font-weight:600;cursor:pointer;color:#1F1B1B;white-space:nowrap}
.inkbar button:hover{border-color:#E6DEDE}
.inkbar button[aria-pressed="true"]{background:#F1EAEA;border-color:#7A0000;color:#7A0000}
.inkbar .sw{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.inkbar i{width:1px;height:24px;background:#E6DEDE;flex:none}
.inkbar .done{background:#7A0000;color:#fff}
.inkbar .done:hover{background:#5C0000}
@media (max-width:560px){.inkbar{gap:0;padding:4px}.inkbar button{padding:.3rem .5rem;font-size:.78rem}.inkbar .sw{margin-right:4px}}
@media print{#inkCv,.inkbtn,.inkbar{display:none}}
.fsbtn{top:calc(58% - 58px)!important}   /* full screen button sits just above the pen */

</style>
<script>
/* Write on any screen. Lines are kept in page position, so they stay on the working when the page scrolls.
   They are wiped when the topic, slide or question changes. Nothing is saved. */
(function(){
  'use strict';
  var cv=document.createElement('canvas');cv.id='inkCv';cv.setAttribute('aria-hidden','true');
  var btn=document.createElement('button');btn.className='inkbtn';btn.type='button';btn.textContent='✎';btn.title='Write on the screen';btn.setAttribute('aria-label','Write on the screen');
  var bar=document.createElement('div');bar.className='inkbar';bar.hidden=true;bar.setAttribute('role','toolbar');bar.setAttribute('aria-label','Writing tools');
  bar.innerHTML='<button type="button" data-t="pen" aria-pressed="true"><span class="sw" style="background:#7A0000"></span>Pen</button>'+
    '<button type="button" data-t="hi" aria-pressed="false"><span class="sw" style="background:#F5D33A"></span>Highlight</button>'+
    '<button type="button" data-t="er" aria-pressed="false">Eraser</button><i></i>'+
    '<button type="button" data-a="undo">Undo</button><button type="button" data-a="clear">Clear</button>'+
    '<button type="button" class="done" data-a="done">Done</button>';
  if(window.__inkTimer)clearInterval(window.__inkTimer);   // only one pen, even after the page is replaced
  Array.prototype.forEach.call(document.querySelectorAll('#inkCv,.inkbtn,.inkbar'),function(x){x.remove()});
  function place(){[cv,btn,bar].forEach(function(n){if(document.body&&!n.isConnected)document.body.appendChild(n)})}
  place();
  var ctx=cv.getContext('2d'),strokes=[],cur=null,tool='pen',dpr=1;
  function size(){dpr=window.devicePixelRatio||1;cv.width=Math.round(innerWidth*dpr);cv.height=Math.round(innerHeight*dpr);draw()}
  function penColour(){return getComputedStyle(document.documentElement).getPropertyValue('--maroon').trim()||'#7A0000'}
  function draw(){
    ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,innerWidth,innerHeight);
    var sx=scrollX,sy=scrollY;
    strokes.forEach(function(s){
      if(!s.p.length)return;
      ctx.save();ctx.lineCap='round';ctx.lineJoin='round';
      if(s.t==='hi'){ctx.globalAlpha=.35;ctx.strokeStyle='#F5D33A';ctx.fillStyle='#F5D33A';ctx.lineWidth=18}
      else{ctx.strokeStyle=penColour();ctx.fillStyle=ctx.strokeStyle;ctx.lineWidth=3}
      ctx.beginPath();
      if(s.p.length===1){ctx.arc(s.p[0][0]-sx,s.p[0][1]-sy,ctx.lineWidth/2,0,7);ctx.fill()}
      else{ctx.moveTo(s.p[0][0]-sx,s.p[0][1]-sy);for(var k=1;k<s.p.length;k++)ctx.lineTo(s.p[k][0]-sx,s.p[k][1]-sy);ctx.stroke()}
      ctx.restore();
    });
  }
  function pt(e){return [e.clientX+scrollX,e.clientY+scrollY]}
  function rub(p){var r=14,before=strokes.length;
    strokes=strokes.filter(function(s){var w=s.t==='hi'?9:2;return !s.p.some(function(q){var dx=q[0]-p[0],dy=q[1]-p[1];return dx*dx+dy*dy<(r+w)*(r+w)})});
    if(strokes.length!==before)draw()}
  cv.addEventListener('pointerdown',function(e){if(!document.body.classList.contains('inking'))return;e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(x){}
    if(tool==='er'){cur={er:true};rub(pt(e));return}
    cur={t:tool,p:[pt(e)]};strokes.push(cur);draw()});
  cv.addEventListener('pointermove',function(e){if(!cur)return;e.preventDefault();
    if(cur.er){rub(pt(e));return}
    var evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];if(!evs.length)evs=[e];
    evs.forEach(function(v){cur.p.push(pt(v))});draw()});
  function end(){cur=null}
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);cv.addEventListener('lostpointercapture',end);
  function open(v){document.body.classList.toggle('inking',v);bar.hidden=!v;btn.hidden=v;if(v)setTool(tool==='er'?'pen':tool)}
  function setTool(t){tool=t;document.body.classList.toggle('ink-erase',t==='er');bar.querySelectorAll('[data-t]').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.t===t)})}
  function clear(){strokes=[];cur=null;draw()}
  btn.onclick=function(){open(true)};
  bar.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
    if(b.dataset.t)setTool(b.dataset.t);
    else if(b.dataset.a==='undo'){strokes.pop();draw()}
    else if(b.dataset.a==='clear')clear();
    else if(b.dataset.a==='done')open(false)});
  /* new topic, slide or question: start with a clean screen */
  var sig='';function key(){var q=document.querySelector('.stage-q,.pq .q,.done h2,main h1,h1');return location.hash+'|'+(q?q.textContent:'')}
  function check(){var k=key();if(k!==sig){sig=k;clear()}}
  addEventListener('hashchange',function(){setTimeout(check,0)});window.__inkTimer=setInterval(function(){place();check()},300);
  addEventListener('scroll',draw,{passive:true});addEventListener('resize',size);
  document.addEventListener('fullscreenchange',function(){setTimeout(size,100)});
  window.__ink={strokes:function(){return strokes.length},clear:clear,open:function(){open(true)}};
  sig=key();size();
})();
</script>
</template>
