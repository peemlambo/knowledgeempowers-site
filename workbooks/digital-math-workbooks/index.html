<style>
  /* every rule starts with #shell so it never changes the look of a topic */
  html{font-size:20px} body{margin:0;background:#fff}
  #shell{font-family:'Public Sans',Arial,sans-serif;color:#222;line-height:1.6;max-width:760px;margin:0 auto;padding:0 22px 60px;-webkit-font-smoothing:antialiased}
  #shell .center{text-align:center}
  #shell .entry{max-width:400px;margin:12vh auto 0;text-align:center}
  #shell img.logo{height:72px}
  #shell .kick{font-size:.9rem;font-weight:500;color:#7A0000}
  #shell h1{font-family:'Bitter',Georgia,serif;font-weight:600;color:#222;font-size:2.3rem;margin:.6rem 0 .3rem;line-height:1.15;letter-spacing:-.01em}
  #shell h2{font-family:'Bitter',Georgia,serif;font-weight:600;font-size:1.3rem;margin:2.6rem 0 .4rem;color:#222}
  #shell .sub{color:#6B6464;font-size:.95rem;margin:0 0 2rem}
  #shell label{display:block;font-size:.9rem;color:#6B6464;margin:0 0 .4rem;text-align:left}
  #shell input{font:inherit;font-size:1.25rem;letter-spacing:.12em;text-transform:uppercase;width:100%;box-sizing:border-box;border:1px solid #D8CECE;border-radius:12px;padding:.7rem .8rem;text-align:center;background:#fff}
  #shell input:focus{outline:none;border-color:#7A0000;box-shadow:0 0 0 3px rgba(122,0,0,.12)}
  #shell .go{font:inherit;font-weight:600;width:100%;margin-top:.9rem;min-height:52px;border:none;border-radius:999px;background:#7A0000;color:#fff;cursor:pointer}
  #shell .go:hover{background:#5C0000}
  #shell .go[disabled]{opacity:.5;cursor:default}
  #shell .msg{min-height:1.4em;margin-top:.9rem;font-size:.95rem;color:#9A1C1C}
  #shell .msg.wait{color:#6B6464}
  #shell .small{font-size:.85rem;color:#6B6464}
  #shell a{color:#7A0000;text-underline-offset:3px}
  #shell :focus-visible{outline:2px solid #7A0000;outline-offset:3px}
  #shell .top{display:flex;align-items:center;gap:12px;min-height:60px;border-bottom:1px solid #EAE3E3}
  #shell .top img{height:28px}
  #shell .top .who{flex:1;font-size:.9rem;color:#6B6464}
  #shell .top .who b{color:#222;font-weight:600}
  #shell .grid{display:flex;flex-direction:column;border-top:1px solid #EAE3E3}
  #shell .tcard{font:inherit;color:#222;text-align:left;display:grid;grid-template-columns:3rem 1fr auto;gap:.15rem 1rem;align-items:center;background:none;border:none;border-bottom:1px solid #EAE3E3;padding:1rem .2rem;width:100%;cursor:pointer}
  #shell .tcard:hover{background:#F8F3F3}
  #shell .tcard .no{grid-row:1 / span 2;font-family:'Bitter',Georgia,serif;font-weight:600;font-size:1.5rem;color:#7A0000;line-height:1}
  #shell .tcard .tt{font-family:'Bitter',Georgia,serif;font-weight:600;font-size:1.1rem;line-height:1.3}
  #shell .tcard .gr{grid-column:2;font-size:.85rem;color:#6B6464}
  #shell .tcard .tag{grid-row:1 / span 2;grid-column:3;font-size:.85rem;color:#6B6464;text-align:right;min-width:5.5rem}
  #shell .tcard .tag i{display:block;height:3px;background:#EAE3E3;border-radius:2px;margin-top:.35rem;overflow:hidden}
  #shell .tcard .tag i b{display:block;height:100%;background:#7A0000}
  #shell .tcard.off{cursor:default}
  #shell .tcard.off:hover{background:none}
  #shell .tcard.off .no,#shell .tcard.off .tt{color:#B3A9A9}
  #shell .loading{position:fixed;inset:0;background:rgba(255,255,255,.88);display:flex;align-items:center;justify-content:center;font-family:'Bitter',Georgia,serif;font-size:1.2rem;color:#7A0000;z-index:99}
  @media (max-width:600px){ html{font-size:19px} #shell{padding:0 18px 60px} #shell h1{font-size:1.9rem} #shell .entry{margin-top:8vh} }

  .free{display:inline-block;margin:.4rem 0 1.4rem;color:#7A0000;font-size:.95rem;text-decoration:none;border-bottom:1px solid #E6DEDE}
  .free:hover{border-color:#7A0000}
.gpick{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:1.6rem 0 .4rem}
.gpick span{font-weight:700;font-size:.9rem;margin-right:6px;color:#1E1414}
.gpick button{font:inherit;font-size:.88rem;border:1px solid #E6DCD6;background:#fff;color:#1E1414;padding:8px 14px;border-radius:999px;cursor:pointer;min-height:40px}
.gpick button.on{background:#7A0000;border-color:#7A0000;color:#fff}

#shell .shelf-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.rep-btn{display:inline-flex;align-items:center;justify-content:center;font:600 .9rem 'Public Sans',sans-serif;background:#7A0000;color:#fff!important;text-decoration:none;border:0;border-radius:2px;padding:11px 18px;min-height:44px;cursor:pointer}
.rep-btn:hover{background:#5C0000}
.rep-link{font:600 .9rem 'Public Sans',sans-serif;background:none;border:0;color:#7A0000;cursor:pointer;padding:10px 0;text-decoration:underline;text-underline-offset:3px}
.report{max-width:900px;margin:0 auto;padding:12px 0 48px}
.rep-head{display:flex;gap:22px;align-items:center;padding:18px 0 26px;border-bottom:1px solid #EAE3E3}
.rep-head img{height:52px;width:auto;display:none}
.rep-head h1{margin:.1rem 0 .2rem;font-family:'Bitter',Georgia,serif;font-size:2rem}
.rep-eb{font-size:.72rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#B08D57}
.rep-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:26px 0}
.rep-sum div{background:#FBF8F4;border:1px solid #EAE3E3;padding:18px 20px;display:grid;gap:2px}
.rep-sum b{font-family:'Bitter',Georgia,serif;font-size:2rem;color:#7A0000;line-height:1.1}
.rep-sum span{font-size:.88rem;color:#5E5150}
.rep-next{border-left:3px solid #7A0000;background:#fff;padding:14px 20px;margin:0 0 26px}
#shell .rep-next h2{font-family:'Bitter',Georgia,serif;font-size:1.35rem;margin:.3rem 0 .35rem!important;padding:0}
.rep-next p{margin:0;color:#5E5150}
.rep-table{width:100%;border-collapse:collapse;font-size:.95rem}
.rep-table th{text-align:left;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:#5E5150;font-weight:700;padding:10px 8px;border-bottom:2px solid #1E1414}
.rep-table td{padding:14px 8px;border-bottom:1px solid #EAE3E3;vertical-align:middle}
.rep-table td[data-l]{white-space:nowrap}
.rep-table td small{display:block;color:#5E5150;font-size:.8rem;margin-top:2px}
.rep-table .bar{display:inline-block;width:70px;height:8px;background:#F1EAE4;border-radius:4px;overflow:hidden;margin-right:8px;vertical-align:middle}
.rep-table .bar i{display:block;height:100%;background:#7A0000}
.rep-note{font-size:.82rem;color:#5E5150;margin-top:18px}
.rep-empty{padding:30px 0}
.rep-actions{display:flex;flex-wrap:wrap;gap:18px;align-items:center;margin-top:28px}
@media (max-width:640px){.rep-sum{grid-template-columns:1fr}.rep-sum div{grid-template-columns:auto 1fr;align-items:baseline;gap:10px}
 .rep-table thead{display:none}.rep-table tr{display:block;border-bottom:1px solid #EAE3E3;padding:10px 0}.rep-table td{display:flex;justify-content:space-between;border:0;padding:4px 0}
 .rep-table td:first-child{display:block}.rep-table td[data-l]::before{content:attr(data-l);color:#5E5150;font-size:.85rem}}
@media print{.rep-head img{display:block!important}.noprint,#kehdr,.kh-wa,.launch,.fsbtn,.inkbtn{display:none!important}html{padding-top:0!important}.report{padding:0}.rep-sum div{background:#fff}}
</style>

      h += '<div class="rep-sum">' +
        '<div><b>' + rows.length + '</b><span>topic' + (rows.length === 1 ? '' : 's') + ' started</span></div>' +
        '<div><b>' + tot.answered + '</b><span>questions answered</span></div>' +
        '<div><b>' + (tot.marked ? pct(tot.first / tot.marked) : '–') + '</b><span>right the first time</span></div></div>';
      if (next) h += '<div class="rep-next"><div class="rep-eb">Work on this next</div><h2>' + esc(next.r.t.title) + '</h2><p>' + next.why + '</p></div>';
      h += '<table class="rep-table"><thead><tr><th>Topic</th><th>Done</th><th>Right first time</th><th>Needed the steps</th><th>Last opened</th></tr></thead><tbody>' +
        rows.map(function (r) {
          return '<tr><td><b>' + esc(r.t.title) + '</b><small>' + esc(r.t.grades || '') + (r.checked ? ' · Diagnose done' : '') + (r.test ? ' · Final test done' : '') + '</small></td>' +
            '<td data-l="Done"><span class="bar"><i style="width:' + pct(r.done) + '"></i></span>' + pct(r.done) + '</td>' +
            '<td data-l="Right first time">' + (r.rate == null ? '–' : pct(r.rate)) + '</td>' +
            '<td data-l="Needed the steps">' + r.steps + '</td>' +
            '<td data-l="Last opened">' + (niceDate(r.last) || '–') + '</td></tr>';
        }).join('') + '</tbody></table>' +
        '<p class="rep-note">“Right first time” counts answers that were correct before any hint. “Needed the steps” counts questions where the full worked answer was shown after two tries. This report is made from the work saved on this device.</p>';
    }
    h += '<div class="rep-actions noprint"><a id="repwa" class="rep-btn" target="_blank" rel="noopener">Send to my parent on WhatsApp</a><button id="repprint" class="rep-link" type="button">Save as PDF or print</button></div></div>';
    shell.innerHTML = h; window.scrollTo(0, 0);
    var txt = 'KnowledgeEmpowers progress report for ' + (ME.name || 'my workbooks') + ' (' + today + ')\n';
    if (rows.length) {
      txt += rows.length + ' topics started, ' + tot.answered + ' questions answered, ' + (tot.marked ? pct(tot.first / tot.marked) : '–') + ' right the first time.\n\n';
      rows.forEach(function (r) { txt += '• ' + r.t.title + ': ' + pct(r.done) + ' done, ' + (r.rate == null ? '–' : pct(r.rate)) + ' right first time\n'; });
      if (next) txt += '\nWork on next: ' + next.r.t.title;
    } else txt += 'No work saved yet.';
    document.getElementById('repwa').href = 'https://wa.me/?text=' + encodeURIComponent(txt);
    document.getElementById('repprint').onclick = function () { window.print(); };
    document.getElementById('repback').onclick = showShelf;
  }
  function showShelf() {
    var h = '<div class="top"><img src="' + LOGO + '" alt="KnowledgeEmpowers"><div class="who"><b>' + esc(ME.name || 'Welcome') + '</b>' +
            (ME.ends ? ', access until ' + esc(ME.ends) : '') + '</div><a href="#" id="signout" class="small">Sign out</a></div>' +
            '<div class="shelf-head"><h1 style="margin-top:2.4rem">Your topics</h1><button id="rep" class="rep-btn" type="button">Report for my parent</button></div>' +
            '<p class="sub">In the order schools usually teach them through the year.</p>';
    // Grade chooser: show only the topics for the learner's grade (or all of them).
    function span(t) { var m = String(t.grades || '').match(/(\d+)\D+(\d+)/) || String(t.grades || '').match(/(\d+)/); return m ? [+m[1], +(m[2] || m[1])] : [0, 99]; }
    var mine = ME.topics.filter(function (t) { return t.allowed; }), gs = [];
    mine.forEach(function (t) { var r = span(t); for (var g = Math.max(4, r[0]); g <= Math.min(12, r[1]); g++) if (gs.indexOf(g) < 0) gs.push(g); });
    gs.sort(function (a, b) { return a - b; });
    var pick = +(store.get('ke-grade-' + ME.code) || 0); if (gs.indexOf(pick) < 0) pick = 0;
    if (gs.length > 1) h += '<div class="gpick" role="group" aria-label="Choose your grade"><span>My grade</span>' +
      '<button data-g="0"' + (pick ? '' : ' class="on"') + '>All</button>' +
      gs.map(function (g) { return '<button data-g="' + g + '"' + (pick === g ? ' class="on"' : '') + '>Grade ' + g + '</button>'; }).join('') + '</div>';
    function fits(t) { if (!pick) return true; var r = span(t); return r[0] <= pick && pick <= r[1]; }
    [1, 2, 3, 4, 5].forEach(function (term) {
      var list = ME.topics.filter(function (t) { return t.term === term && fits(t); });
      if (!list.length) return;
      // Show the Grades 10–12 shelf only to codes that open at least one of those books (and the Grades 5–9 terms only to codes that open one of those).
      var band = ME.topics.filter(function (t) { return (t.term === 5) === (term === 5); });
      if (!band.some(function (t) { return t.allowed; })) return;
      h += '<h2>' + esc(ME.terms[term]).replace(' · ', '</h2><p class="small" style="margin:0 0 .9rem">') + '</p><div class="grid">';
      list.forEach(function (t) {
        var p = t.ready && t.allowed ? progress(t.key) : 0;
        var tag = !t.ready ? '<span class="tag">Coming soon</span>'
                : !t.allowed ? '<span class="tag">Not on your code</span>'
                : p ? '<span class="tag">' + Math.round(p * 100) + '%<i><b style="width:' + Math.round(p * 100) + '%"></b></i></span>' : '<span class="tag" style="color:#7A0000">Open</span>';
        var on = t.ready && t.allowed;
        h += '<button class="tcard' + (on ? '' : ' off') + '" ' + (on ? 'data-key="' + t.key + '"' : 'disabled') + '>' +
             '<span class="no">' + t.no + '</span><span class="tt">' + esc(t.title) + '</span><span class="gr">' + esc(t.grades) + '</span>' + tag + '</button>';
      });
      h += '</div>';
    });
    h += '<p class="small" style="margin-top:2.4rem">To add a topic to your code, contact KnowledgeEmpowers on www.knowledgeempowers.online.</p>';
    shell.innerHTML = h; shell.hidden = false; window.scrollTo(0, 0);
    Array.prototype.forEach.call(shell.querySelectorAll('[data-key]'), function (b) { b.onclick = function () { openTopic(b.getAttribute('data-key')); }; });
    Array.prototype.forEach.call(shell.querySelectorAll('.gpick [data-g]'), function (b) { b.onclick = function () { store.set('ke-grade-' + ME.code, b.getAttribute('data-g')); showShelf(); }; });
    var rb = document.getElementById('rep'); if (rb) rb.onclick = showReport;
    document.getElementById('signout').onclick = function (e) { e.preventDefault(); store.del('ke-code'); ME = null; showCode(''); };
  }

  /* ---------- 3. open a topic (and come back) ---------- */
  function busy(on) { var b = document.getElementById('keBusy');
    if (on && !b) { b = document.createElement('div'); b.id = 'keBusy'; b.className = 'loading'; b.textContent = 'Opening…'; shell.appendChild(b); }
    if (!on && b) b.remove(); }
  function openTopic(key) {
    try { store.set('ke-last-' + key + '-' + ME.code, new Date().toISOString().slice(0, 10)); } catch (e) {}
    busy(true);
    google.script.run
      .withSuccessHandler(function (r) {
        busy(false);
        if (!r || !r.ok) { alert((r && r.msg) || 'Something went wrong. Please try again.'); if (r && /code|ended|switched/.test(r.msg || '')) showCode(r.msg); return; }
        var data; try { data = readTopic(r.data); } catch (e) { alert('Setup problem: the file T_' + key.replace(/-/g, '_') + ' in Apps Script is not complete. Paste it in again, then publish a new version.'); return; }
        mount(r.html, data, { name: r.name, ends: r.ends, code: r.code, key: key });
      })
      .withFailureHandler(function () { busy(false); alert('Could not reach KnowledgeEmpowers. Check your internet and try again.'); })
      .openTopic(ME.code, dev, key);
  }
  // Topic files are stored as plain letters and numbers (base64); this turns them back into questions.
  function readTopic(text) {
    text = String(text || '').trim();
    if (text.charAt(0) === '{') return JSON.parse(text);
    var bin = atob(text.replace(/\s+/g, ''));
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return JSON.parse(new TextDecoder('utf-8').decode(bytes));
  }
  // Puts the topic into this page (styles, screens and script), without reloading.
  function mount(html, data, gate) {
    unmount();
    window.KE_GATE = gate;
    window.KE_TOPIC_DATA = data;
    var doc = new DOMParser().parseFromString(html, 'text/html');
    Array.prototype.forEach.call(doc.head.querySelectorAll('style, link[rel="stylesheet"]'), function (n) {
      var c = document.importNode(n, true); c.setAttribute('data-topic', '1'); document.head.appendChild(c); });
    var scripts = Array.prototype.slice.call(doc.body.querySelectorAll('script'));
    scripts.forEach(function (s) { s.parentNode.removeChild(s); });
    shell.hidden = true; host.innerHTML = doc.body.innerHTML;
    var errs = [], onErr = function (e) { errs.push((e && e.message) || String(e)); };
    window.addEventListener('error', onErr);
    window.KE_ENGINE_VERSION = 0;
    scripts.forEach(function (s) { var n = document.createElement('script'); n.text = s.textContent; host.appendChild(n); });
    window.scrollTo(0, 0);
    // If the workbook did not start, show why instead of a blank page.
    setTimeout(function () {
      window.removeEventListener('error', onErr);
      var app = document.getElementById('app');
      var problem = '';
      if (!scripts.length) problem = 'The Engine file has no workbook code in it. Paste the whole Engine.html into the Engine file again.';
      else if (window.KE_ENGINE_VERSION !== ENGINE_VERSION) problem = 'The Engine file in Apps Script is an older copy (version ' + (window.KE_ENGINE_VERSION || 'unknown') + '). Paste the newest Engine.html into it.';
      else if (errs.length) problem = 'The workbook stopped with this error: ' + errs[0];
      else if (!app || !app.innerHTML.trim()) problem = 'The workbook did not draw its first page.';
      if (problem) { unmount(); showShelf(); showProblem(problem); }
    }, 900);
  }
  var ENGINE_VERSION = 4;            // must match KE_ENGINE_VERSION in Engine.html
  function showProblem(text) {
    var box = document.createElement('div');
    box.setAttribute('style', 'border:2px solid #9a1c1c;background:#fbeaea;border-radius:12px;padding:1rem;margin:1rem 0;font-size:.95rem');
    box.innerHTML = '<b style="color:#9a1c1c">The topic did not open.</b><br>' + esc(text) +
      '<br><span class="small">Please take a screenshot of this box and send it to KnowledgeEmpowers.</span>';
    shell.insertBefore(box, shell.children[1] || null); window.scrollTo(0, 0);
  }
  function unmount() {
    if (window.KE_CLEANUP) { try { window.KE_CLEANUP(); } catch (e) {} window.KE_CLEANUP = null; }
    host.innerHTML = '';
    Array.prototype.forEach.call(document.querySelectorAll('[data-topic]'), function (n) { n.parentNode.removeChild(n); });
    document.body.className = ''; document.documentElement.removeAttribute('style'); document.title = 'KnowledgeEmpowers';
  }
  // The "Topics" button inside a topic calls this.
  window.KE_SHELF = function () { unmount(); window.KE_TOPIC_DATA = null; showShelf(); };

  showCode('');
})();
</script>

<script>
/* Full screen: fills the whole screen (the website menu and browser bars go away). Press again or Esc to leave. */
(function(){
  var d=document,el=d.documentElement;
  var can=!!(el.requestFullscreen||el.webkitRequestFullscreen)&&(d.fullscreenEnabled!==false||d.webkitFullscreenEnabled);
  if(!can)return;                                   // e.g. iPhone: not allowed for web pages, so no button
  var OPEN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
  var SHUT='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>';
  var b=d.createElement('button');b.type='button';b.className='fsbtn';
  function isFull(){return !!(d.fullscreenElement||d.webkitFullscreenElement)}
  function paint(){var f=isFull();b.innerHTML=f?SHUT:OPEN;b.title=f?'Leave full screen':'Full screen';b.setAttribute('aria-label',b.title)}
  b.onclick=function(){try{if(isFull())(d.exitFullscreen||d.webkitExitFullscreen).call(d);else(el.requestFullscreen||el.webkitRequestFullscreen).call(el)}catch(e){}};
  d.addEventListener('fullscreenchange',paint);d.addEventListener('webkitfullscreenchange',paint);
  paint();
  function place(){if(d.body&&!b.isConnected)d.body.appendChild(b)}   // put it back if a page change removes it
  if(window.__fsTimer)clearInterval(window.__fsTimer);           // only one button, even after the page is replaced

<script>
/* Write on any screen. Lines are kept in page position, so they stay on the working when the page scrolls.
   They are wiped when the topic, slide or question changes. Nothing is saved. */
(function(){
  'use strict';
  var cv=document.createElement('canvas');cv.id='inkCv';cv.setAttribute('aria-hidden','true');
  var btn=document.createElement('button');btn.className='inkbtn';btn.type='button';btn.textContent='✎';btn.title='Write on the screen';btn.setAttribute('aria-label','Write on the screen');
  var bar=document.createElement('div');bar.className='inkbar';bar.hidden=true;bar.setAttribute('role','toolbar');bar.setAttribute('aria-label','Writing tools');
  bar.innerHTML='<button type="button" data-t="pen" aria-pressed="true"><span class="sw" style="background:#7A0000"></span>Pen</button>'+
    '<button type="button" data-t="hi" aria-pressed="false"><span class="sw" style="background:#F5D33A"></span>Highlight</button>'+
    '<button type="button" data-t="er" aria-pressed="false">Eraser</button><i></i>'+
    '<button type="button" data-a="undo">Undo</button><button type="button" data-a="clear">Clear</button>'+
    '<button type="button" class="done" data-a="done">Done</button>';
  if(window.__inkTimer)clearInterval(window.__inkTimer);   // only one pen, even after the page is replaced
  Array.prototype.forEach.call(document.querySelectorAll('#inkCv,.inkbtn,.inkbar'),function(x){x.remove()});
  function place(){[cv,btn,bar].forEach(function(n){if(document.body&&!n.isConnected)document.body.appendChild(n)})}
  place();
  var ctx=cv.getContext('2d'),strokes=[],cur=null,tool='pen',dpr=1;
  function size(){dpr=window.devicePixelRatio||1;cv.width=Math.round(innerWidth*dpr);cv.height=Math.round(innerHeight*dpr);draw()}
  function penColour(){return getComputedStyle(document.documentElement).getPropertyValue('--maroon').trim()||'#7A0000'}
  function draw(){
    ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,innerWidth,innerHeight);
    var sx=scrollX,sy=scrollY;
    strokes.forEach(function(s){
      if(!s.p.length)return;
      ctx.save();ctx.lineCap='round';ctx.lineJoin='round';
      if(s.t==='hi'){ctx.globalAlpha=.35;ctx.strokeStyle='#F5D33A';ctx.fillStyle='#F5D33A';ctx.lineWidth=18}
      else{ctx.strokeStyle=penColour();ctx.fillStyle=ctx.strokeStyle;ctx.lineWidth=3}
      ctx.beginPath();
      if(s.p.length===1){ctx.arc(s.p[0][0]-sx,s.p[0][1]-sy,ctx.lineWidth/2,0,7);ctx.fill()}
      else{ctx.moveTo(s.p[0][0]-sx,s.p[0][1]-sy);for(var k=1;k<s.p.length;k++)ctx.lineTo(s.p[k][0]-sx,s.p[k][1]-sy);ctx.stroke()}
      ctx.restore();
    });
  }
  function pt(e){return [e.clientX+scrollX,e.clientY+scrollY]}
  function rub(p){var r=14,before=strokes.length;
    strokes=strokes.filter(function(s){var w=s.t==='hi'?9:2;return !s.p.some(function(q){var dx=q[0]-p[0],dy=q[1]-p[1];return dx*dx+dy*dy<(r+w)*(r+w)})});
    if(strokes.length!==before)draw()}
  cv.addEventListener('pointerdown',function(e){if(!document.body.classList.contains('inking'))return;e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(x){}
    if(tool==='er'){cur={er:true};rub(pt(e));return}
    cur={t:tool,p:[pt(e)]};strokes.push(cur);draw()});
  cv.addEventListener('pointermove',function(e){if(!cur)return;e.preventDefault();
    if(cur.er){rub(pt(e));return}
    var evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];if(!evs.length)evs=[e];
    evs.forEach(function(v){cur.p.push(pt(v))});draw()});
  function end(){cur=null}
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);cv.addEventListener('lostpointercapture',end);
  function open(v){document.body.classList.toggle('inking',v);bar.hidden=!v;btn.hidden=v;if(v)setTool(tool==='er'?'pen':tool)}
  function setTool(t){tool=t;document.body.classList.toggle('ink-erase',t==='er');bar.querySelectorAll('[data-t]').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.t===t)})}
  function clear(){strokes=[];cur=null;draw()}
  btn.onclick=function(){open(true)};
  bar.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
    if(b.dataset.t)setTool(b.dataset.t);
    else if(b.dataset.a==='undo'){strokes.pop();draw()}
    else if(b.dataset.a==='clear')clear();
    else if(b.dataset.a==='done')open(false)});
  /* new topic, slide or question: start with a clean screen */
  var sig='';function key(){var q=document.querySelector('.stage-q,.pq .q,.done h2,main h1,h1');return location.hash+'|'+(q?q.textContent:'')}
  function check(){var k=key();if(k!==sig){sig=k;clear()}}
  addEventListener('hashchange',function(){setTimeout(check,0)});window.__inkTimer=setInterval(function(){place();check()},300);
  addEventListener('scroll',draw,{passive:true});addEventListener('resize',size);
  document.addEventListener('fullscreenchange',function(){setTimeout(size,100)});
  window.__ink={strokes:function(){return strokes.length},clear:clear,open:function(){open(true)}};
  sig=key();size();
})();
</script>
